name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build (npm workspaces)
    runs-on: ubuntu-latest
    env:
      # Build-time public placeholders only; real values are injected by CodeBuild (AWS) or Render.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: API unit tests (no database)
        run: npm test -w @spaceborn/api -- test/domain.test.ts

      - name: Build shared package, API and the three Next.js apps
        run: npm run render:build:unified
