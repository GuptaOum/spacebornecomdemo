# ==============================================================================
# Spaceborn E-Commerce & Fabrication Platform — Unified Gateway Blueprint
# https://render.com/docs/blueprint-spec
#
# Runs all 4 services (API, Storefront, Vendor Hub, Admin Panel) inside
# 1 single Render Web Service container on Free Tier.
#
# Cost: $0.00 / month (1 service * 720 hours <= 750 free hours/month limit)
# Routing: Managed by `scripts/render-gateway.mjs`
# Interactive Navigation: Switch between all portals via the built-in floating pill or /__portal
# ==============================================================================

services:
  - type: web
    name: spaceborn-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render:build:unified
    startCommand: npm run render:start:unified
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: require
      - key: PAYMENTS_ALLOW_MOCK
        value: "true"
      - key: UPLOADS_ALLOW_LOCAL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: SHOW_DEMO_BANNER
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
